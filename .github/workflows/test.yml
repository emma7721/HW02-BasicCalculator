name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test --test-reporter=tap tests/automated/calculator.test.js > reports/test-results.tap
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-results.tap
